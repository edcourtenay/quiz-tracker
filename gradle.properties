org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true

# ---------------------------------------------------------------------------
# Gradle JVM
# ---------------------------------------------------------------------------
# Android Studio's embedded JetBrains Runtime is Java 25, but Gradle 8.14.3 can
# only run on Java 1.8-24 (Java 25 support starts at Gradle 9.1). Pin the Gradle
# daemon to an installed JDK 17/21 so builds work regardless of the IDE's
# "Gradle JDK" selection. Change this path if your JDK lives elsewhere.
org.gradle.java.home=/Library/Java/JavaVirtualMachines/openjdk-21.jdk/Contents/Home

# AndroidX
android.useAndroidX=true

# Kotlin
kotlin.code.style=official

# Only build the resources for the languages the app ships with.
android.nonTransitiveRClass=true

# Enabled parallel sync for Gradle 9.4+
org.gradle.tooling.parallel=true
